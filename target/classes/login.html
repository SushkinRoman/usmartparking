<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - Умная парковка</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .link { margin-top: 15px; font-size: 14px; }
        .link a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Вход в систему</h2>
    <input type="text" id="username" placeholder="Логин (тест: test)">
    <input type="password" id="password" placeholder="Пароль (тест: 123)">
    <button onclick="login()">Войти</button>
    <p id="message" style="color: red; font-size: 12px;"></p>
    <div class="link">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></div>
</div>

<script>
    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (data.success) {
            localStorage.setItem('user', username);
            window.location.href = '/';
        } else {
            document.getElementById('message').innerText = data.message;
        }
    }
</script>
</body>
</html>
